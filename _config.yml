about_content: |
  #### **소리의 가치를 믿는 사운드 개발자 박상현입니다.**

  나인아크에서 5년간 사내 모든 프로젝트의 SFX 및 Voice 총괄 역할을 맡아, 초기 설계부터 라이브 서비스 운영까지 사운드 개발 프로세스를 주도했습니다. 프로토타입부터 소프트 런칭, 라이브 안정화까지 프로젝트들의 시작과 성장을 함께하며 탄탄한 사운드 환경을 구축하는 데 집중해 왔습니다.

  소리를 다루는 과정을 항상 즐겁고 감사하게 생각합니다. 전문성을 확장해 나가면서도, 소리 본질의 가치를 잊지 않는 사운드 개발자가 되고자 합니다.

  ---

  **Core Philosophy: 업무를 대하는 세 가지 원칙**
  - **저는 사운드 ‘개발자’ 입니다.** 소리를 만드는 것에 그치지 않고, 사운드가 게임 안에서 어떻게 구현되고 동작해야 하는지까지 고민합니다. 기술적 이해를 바탕으로 기획 및 개발팀과 소통하며, 프로젝트에 필요한 사운드와 시스템을 함께 만들어가는 역할을 지향합니다.
  - **문제를 회피하지 않습니다.** 오디오 전반을 담당하며 발생하는 다양한 기술적 문제를 직접 원인부터 찾아 해결해 왔습니다. 단순히 당장의 문제를 해결하는 데 그치지 않고,그 과정에서 얻은 인사이트를 데이터화 하여 새로운 프로젝트의 안정성을 높이는 자산으로 사용합니다.
  - **자기주도적으로 움직입니다.** 프로젝트의 상황과 일정에 맞춰 필요한 작업을 스스로 정의하고 우선순위를 세워 움직입니다. 명확한 타임라인과 작업 프로세스를 구축하고, 개발 단계가 바뀌어도 사운드 작업이 안정적으로 이어질 수 있는 환경을 만들어 왔습니다.

 ---

  **직무 역량**

  대표작인 ‘에버소울’을 비롯한 사내 프로젝트에서 유관부서와 함께 오디오 파이프라인 설계를 담당했으며, 수많은 캐릭터의 전투 SFX와 연출 애니메이션, UI/UX 사운드를 제작했습니다. 시각적 연출의 의도를 파악하고 이를 사운드로 직관적으로 표현하는 동시에, 게임 플레이에서 필요한 정보가 소리를 통해 자연스럽게 전달될 수 있도록 고민해 왔습니다.

  Voice 영역에서는 약 600시간 분량의 성우 보이스를 직접 가공하고 관리·적용하며, 방대한 양의 어셋을 체계적으로 관리했습니다. 단순한 후반 작업에 머무르지 않고 실제 게임에 적용되는 과정까지 담당하며, 콘텐츠의 양이 많아질수록 효율적인 관리 구조와 일관된 품질 유지가 중요하다는 것을 경험했습니다.

  또한 인게임 오디오 로직 구현과 엔진 내 공간 배치, 믹싱까지 직접 담당하며 사운드가 게임 안에서 구현되는 과정을 폭넓게 다뤄왔습니다. 신규 프로젝트에서는 Master Audio를 도입해 오디오 시스템을 구축하고, 초기 단계부터 사운드가 안정적으로 제작·관리될 수 있는 구조를 직접 설계하고 적용했습니다.

  제가 생각하는 게임 사운드는 단순히 효과음을 제작하거나 엔진에 올리는 작업을 넘어, 플레이어를 세계관 속에 자연스럽게 몰입하게 만드는 '인터랙티브 경험의 핵심'입니다. '연출에 충실한 소리'와 '잘 정돈된 소리'가 함께할 때 좋은 사운드 경험이 만들어진다고 생각합니다. 연출에 맞는 사운드 디자인뿐 아니라 정교한 EQ와 공간 배치를 통해 각 소리가 제 역할을 하도록 만드는 것까지 사운드 개발의 일부라고 생각하며 작업해 왔습니다.

  이러한 경험을 바탕으로 주력으로 사용해 온 Unity 환경은 물론, 새로운 엔진이나 미들웨어를 접하더라도 프로젝트의 오디오 구조와 개발 환경을 빠르게 파악하고 업무에 적용할 수 있습니다. 콘텐츠 제작과 시스템 구현을 함께 이해하고 있는 만큼, 새로운 프로젝트에서도 필요한 역할을 빠르게 찾아 안정적인 오디오 환경을 만들어가는 것을 강점으로 생각합니다.

  ---

